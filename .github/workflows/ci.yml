name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:
  validate:
    name: Validate data and build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate source and frontend platform coverage
        run: |
          python - <<'PY'
          import ast
          import re
          from pathlib import Path

          sources_text = Path('scripts/sources_config.py').read_text(encoding='utf-8')
          module = ast.parse(sources_text)
          sources = None
          for node in module.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == 'SOURCES':
                          sources = ast.literal_eval(node.value)
          if sources is None:
              raise SystemExit('SOURCES not found in scripts/sources_config.py')

          source_platforms = {item['platform'] for item in sources}
          types_text = Path('src/lib/types.ts').read_text(encoding='utf-8')
          meta_platforms = set(re.findall(r'^\s*([a-zA-Z0-9_-]+):\s*\{\s*label:', types_text, flags=re.MULTILINE))

          missing = sorted(source_platforms - meta_platforms)
          stale = sorted(meta_platforms - source_platforms)

          if missing:
              raise SystemExit(f'PLATFORM_META missing source platforms: {missing}')

          print(f'Platform coverage OK: {len(source_platforms)} source platforms covered')
          if stale:
              print(f'Note: frontend has platforms without active source config: {stale}')
          PY

      - name: Validate JSON data shape
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          allowed_categories = {
              'ad-product', 'api-change', 'policy', 'creative',
              'measurement', 'targeting', 'automation', 'other',
          }
          allowed_importance = {'high', 'medium', 'low'}
          required = {'id', 'date', 'platform', 'title', 'summary', 'category', 'importance', 'source', 'sourceUrl', 'tags', 'fetchedAt'}

          path = Path('data/updates.json')
          if not path.exists():
              raise SystemExit('data/updates.json does not exist')

          data = json.loads(path.read_text(encoding='utf-8'))
          if not isinstance(data, list):
              raise SystemExit('data/updates.json must be a JSON array')

          ids = set()
          issues = []
          for idx, item in enumerate(data):
              missing = required - set(item)
              if missing:
                  issues.append(f'item[{idx}] missing {sorted(missing)}')
              item_id = item.get('id')
              if item_id in ids:
                  issues.append(f'duplicate id: {item_id}')
              ids.add(item_id)
              if item.get('category') not in allowed_categories:
                  issues.append(f'item[{idx}] invalid category: {item.get("category")}')
              if item.get('importance') not in allowed_importance:
                  issues.append(f'item[{idx}] invalid importance: {item.get("importance")}')
              if not isinstance(item.get('tags'), list):
                  issues.append(f'item[{idx}] tags must be list')

          if issues:
              print('\n'.join(issues[:50]))
              raise SystemExit(f'Data validation failed: {len(issues)} issue(s)')

          print(f'Data validation OK: {len(data)} updates')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
